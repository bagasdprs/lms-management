name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          # Belum ada deployment target, jadi env var asli belum wajib ada.
          # @t3-oss/env-nextjs bakal nolak build kalau env wajib kosong,
          # flag ini skip validasi env khusus untuk CI build check.
          SKIP_ENV_VALIDATION: true
